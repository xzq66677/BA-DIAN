<!doctype html>
<!-- 角色视觉验收 harness（隔离运行）：直接挂载角色工厂 rig，真实 WebGL 渲染。
     用法：char-harness.html?char=laodaye&pose=attack&t=0.4&view=front|three|lineup
     由 scripts/char-shots.ts 驱动；不参与游戏运行时。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>char harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #14161c; overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  #label { position: fixed; left: 8px; top: 8px; color: #9fb0c8; font: 12px monospace; white-space: pre; z-index: 2; }
</style>
</head>
<body>
<div id="stage"></div>
<pre id="label"></pre>
<script type="module">
import * as THREE from 'three';
import { createCharacterAsset, DEDICATED_CHAR_IDS } from '/src/battle3d/characters/index.ts';

const params = new URLSearchParams(location.search);
const stage = document.getElementById('stage');
const label = document.getElementById('label');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x14161c);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x14161c, 6, 14);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 60);

scene.add(new THREE.HemisphereLight(0xbdd4ff, 0x3a3630, 1.05));
const sun = new THREE.DirectionalLight(0xfff2df, 1.5);
sun.position.set(2.5, 4, 3);
scene.add(sun);

// 简化台面（与战场平台同色系，仅作落地面参考）
const ground = new THREE.Mesh(
  new THREE.CylinderGeometry(2.1, 2.2, 0.12, 40),
  new THREE.MeshStandardMaterial({ color: 0x3a4350, roughness: 0.9 }),
);
ground.position.y = -0.06;
scene.add(ground);
const grid = new THREE.GridHelper(8, 16, 0x556270, 0x2a303a);
grid.position.y = 0.001;
scene.add(grid);

let current = null; // { asset, group }

function clearCurrent() {
  if (!current) return;
  current.asset.dispose();
  current.group.removeFromParent();
  current = null;
}

function setCamera(view) {
  if (view === 'front') camera.position.set(0, 0.95, 3.1);
  else if (view === 'side') camera.position.set(3.1, 0.95, 0.4);
  else if (view === 'back') camera.position.set(0, 0.95, -3.1);
  else camera.position.set(2.05, 1.45, 2.6); // three-quarter（默认机位参考）
  camera.lookAt(0, 0.72, 0);
}

function fitCameraToRoot(root, view) {
  // 高个/矮个角色统一取景：相机看向身体中部，距离按包围球推
  const box = new THREE.Box3().setFromObject(root, true);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y * 0.9, size.z);
  const dir = view === 'front' ? new THREE.Vector3(0, 0.12, 1)
    : view === 'side' ? new THREE.Vector3(1, 0.12, 0.13)
    : view === 'back' ? new THREE.Vector3(0, 0.12, -1)
    : new THREE.Vector3(0.66, 0.38, 0.82).normalize();
  camera.position.copy(center).addScaledVector(dir, radius * 2.35 + 0.55);
  camera.lookAt(center.x, center.y * 0.92, center.z);
}

function mount(charId, poseFn, poseLabel) {
  clearCurrent();
  const asset = createCharacterAsset(charId);
  const group = new THREE.Group();
  group.add(asset.rig.root);
  scene.add(group);
  asset.rig.resetPose();
  if (poseFn) poseFn(asset.rig);
  if (params.get('stick') === '1') {
    const st = asset.rig.root.getObjectByName('stick');
    if (st) st.visible = true; // 场景按快照 char.stickDrawn 驱动；harness 用参数模拟
  }
  asset.rig.root.updateMatrixWorld(true);
  current = { asset, group };
  setCamera(params.get('view') ?? 'three');
  fitCameraToRoot(asset.rig.root, params.get('view') ?? 'three');
  const box = new THREE.Box3().setFromObject(asset.rig.root, true);
  const st = asset.rig.root.getObjectByName('stick');
  const stInfo = st ? ` stick.visible=${st.visible} @(w)${JSON.stringify(st.getWorldPosition(new THREE.Vector3()).toArray().map(v => +v.toFixed(2)))}` : '';
  label.textContent = [
    `char=${charId} pose=${poseLabel ?? 'reset'} view=${params.get('view') ?? 'three'}`,
    `id=${asset.id} head=${asset.rig.headHeight().toFixed(3)}${stInfo}`,
    `bbox min.y=${box.min.y.toFixed(3)} max.y=${box.max.y.toFixed(3)}`,
  ].join('\n');
  renderer.render(scene, camera);
}

function lineup(chars) {
  clearCurrent();
  const group = new THREE.Group();
  const assets = [];
  chars.forEach((id, i) => {
    const asset = createCharacterAsset(id);
    assets.push(asset);
    asset.rig.resetPose();
    asset.rig.root.position.x = (i - (chars.length - 1) / 2) * 1.05;
    group.add(asset.rig.root);
  });
  scene.add(group);
  current = { asset: { dispose() { assets.forEach(a => a.dispose()); }, rig: { root: group } }, group };
  setCamera('three');
  camera.position.set(0, 1.05, 4.6);
  camera.lookAt(0, 0.72, 0);
  const box = new THREE.Box3().setFromObject(group, true);
  label.textContent = `lineup: ${chars.join(', ')}\nbbox ${box.min.y.toFixed(3)} .. ${box.max.y.toFixed(3)}`;
  renderer.render(scene, camera);
}

const POSES = {
  reset: r => r.resetPose(),
  idle: r => r.idle(0.7, 0),
  walk: r => r.walk(0.2, 1),
  attack: r => r.attackSwing(0.4),
  attack_end: r => r.attackSwing(0.95),
  flinch: r => r.flinch(0.5),
  cast: r => r.cast(0.5),
  drink: r => r.drink(0.8),
  crouch: r => r.crouch(0.8),
  cheer: r => r.cheer(0.8),
  dead: r => r.dead(1),
  revive: r => r.reviveRise(0.5),
  signal: r => r.signalActor?.(0.4),
};

const char = params.get('char');
const chars = params.get('chars');
if (chars) {
  lineup(chars.split(','));
} else if (char) {
  const poseName = params.get('pose') ?? 'reset';
  const pose = POSES[poseName];
  if (!pose) throw new Error(`unknown pose: ${poseName}`);
  mount(char, pose, poseName);
} else {
  lineup([...DEDICATED_CHAR_IDS]);
}

addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.render(scene, camera);
});

window.__harness = { mount: (c, p) => mount(c, POSES[p], p) };
</script>
</body>
</html>
