    <g transform="translate(128,94)">
      <path d="M -10 6 Q -12 -1 -7 -5 Q -4 -7 0 -6 Q 6 -6 9 -2 Q 11 1 10 6 Q 10 9 7 9 L -7 9 Q -10 9 -10 6 Z" fill="#d8b04a" fill-opacity="0.25" stroke="#f7e6a8" stroke-width="1.6"/>
      <g fill="none" stroke="#f7e6a8" stroke-width="1.2" stroke-linecap="round"><path d="M -6 -2 Q -5 -5 -2 -4"/><path d="M 1 -5 Q 3 -6 5 -4"/></g>
    </g>
    <g transform="translate(154,140)">
      <g fill="none" stroke="#f7e6a8" stroke-width="4.6" stroke-linecap="round"><path d="M -4 8 L -8 -8"/><path d="M 2 8 L 7 -9"/></g>
      <path d="M -9 3 Q -10 9 -5 9 L 5 9 Q 10 9 9 3 Z" fill="#e8dcc0" fill-opacity="0.28" stroke="#f7e6a8" stroke-width="1.5"/>
