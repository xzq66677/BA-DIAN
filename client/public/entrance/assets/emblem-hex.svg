<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="拔典六棱徽记">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fbf1c4"/><stop offset="35%" stop-color="#e8c86a"/><stop offset="70%" stop-color="#d8b04a"/><stop offset="100%" stop-color="#7d682f"/>
    </linearGradient>
    <linearGradient id="tf" x1="0.2" y1="0" x2="0.8" y2="1">
