    <polygon points="128,202 206,156 206,166 128,212" fill="url(#sr)" stroke="#6a5a30" stroke-width="1.2"/>
    <polygon points="50,94 50,156 50,166 50,104" fill="url(#sl)"/>
    <polygon points="206,156 206,94 206,104 206,166" fill="url(#sr)"/>
