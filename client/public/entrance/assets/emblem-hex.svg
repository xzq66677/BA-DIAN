    <linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1b2632"/><stop offset="100%" stop-color="#080d13"/></linearGradient>
    <linearGradient id="sr" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2a3a4b"/><stop offset="100%" stop-color="#0a1016"/></linearGradient>
    <radialGradient id="v" cx="50%" cy="42%" r="66%"><stop offset="0%" stop-color="#1c2836"/><stop offset="100%" stop-color="#0a0f16"/></radialGradient>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#v)"/>
  <g transform="translate(0,-4)">
