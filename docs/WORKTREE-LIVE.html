<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BA-DIAN · 分支与认领实时树图</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --text:#e6edf3; --muted:#8b949e; --accent:#58a6ff;
    --ready:#7ee787; --progress:#e3b341; --review:#79c0ff; --done:#d2a8ff;
    --p0:#ff7b72; --p1:#e3b341; --agent:#56d4dd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.5;padding:24px;max-width:1100px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  button{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:6px;
    padding:6px 12px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
  .status{color:var(--muted);font-size:12px}
  .note{color:var(--muted);font-size:12px;background:var(--panel);border:1px dashed var(--border);
    border-radius:8px;padding:10px 12px;margin-bottom:18px}
  .note a{color:var(--accent)}

  /* tree */
  .tree{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
  ul.tree-root,ul.children{list-style:none;margin:0;padding:0}
  ul.children{margin-left:22px;border-left:1px solid var(--border);padding-left:18px}
  li{position:relative;margin:3px 0}
  .node{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:7px;
    font-size:13px;cursor:default}
  .node.group{cursor:pointer;font-weight:600;background:var(--panel);border:1px solid var(--border)}
  .node.group:hover{border-color:var(--accent)}
  .node.root{background:var(--accent);color:#fff;font-weight:700;font-size:15px;display:inline-flex}
  .node.leaf{background:transparent}
  .node.leaf:hover{background:var(--panel)}
  .twist{display:inline-block;width:14px;color:var(--muted);font-size:11px;cursor:pointer}
  .twist.empty{opacity:.3}
  .label{word-break:break-word}
  .label a{color:var(--accent);text-decoration:none}
  .label a:hover{text-decoration:underline}
  .branch{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
  .meta{color:var(--muted);font-size:11px;display:inline-flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:6px}
  .assignee{color:var(--a5d6ff,#a5d6ff)}
  .tag{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid var(--border);white-space:nowrap}
  .t-ready{color:var(--ready);border-color:var(--ready)}
  .t-progress{color:var(--progress);border-color:var(--progress)}
  .t-review{color:var(--review);border-color:var(--review)}
  .t-done{color:var(--done);border-color:var(--done)}
  .t-p0{color:var(--p0);border-color:var(--p0)}
  .t-p1{color:var(--p1);border-color:var(--p1)}
  .t-agent{color:var(--agent);border-color:var(--agent)}
  .count{background:var(--border);border-radius:20px;padding:0 8px;font-size:11px;color:var(--muted)}
  .empty{color:var(--muted);font-size:12px;font-style:italic;padding:6px 10px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border);
    border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .err{color:var(--p0);font-size:13px}
  .collapsed > ul.children{display:none}
</style>
</head>
<body>
  <h1>BA-DIAN · 分支与认领实时树图</h1>
  <div class="sub">每次打开自动从 GitHub API 实时拉取 · 树形结构 · 点击分组可展开/折叠</div>

  <div class="toolbar">
    <button class="primary" id="refresh">🔄 刷新数据</button>
    <button id="expand">全部展开</button>
    <button id="collapse">全部折叠</button>
    <span class="status" id="status"><span class="spin"></span> 正在拉取…</span>
  </div>

  <div class="note">
    ⚠️ 本树追踪 <b>GitHub 上的远程分支 / PR / Issue 认领</b>（API 可实时获取）。
    <code>git worktree</code> 是本地概念，GitHub 看不到——本地 worktree 快照见底部分组与
    <a href="WORKTREE-MAP.html">WORKTREE-MAP.html</a>。
  </div>

  <div class="tree">
    <ul class="tree-root" id="tree">
      <li><div class="node root"><span class="twist"></span><span class="label">📦 BA-DIAN 仓库</span></div>
        <ul class="children" id="root-children">
          <li class="loading"><div class="empty">加载中…</div></li>
        </ul>
      </li>
    </ul>
  </div>

<script>
const API = 'https://api.github.com/repos/xzq66677/BA-DIAN';
const H = { 'User-Agent': 'BA-DIAN-worktree-map', 'Accept': 'application/vnd.github+json' };

function tagClass(name){
  if (/status:\s*ready/i.test(name)) return 't-ready';
  if (/status:\s*in-progress/i.test(name)) return 't-progress';
  if (/status:\s*review/i.test(name)) return 't-review';
  if (/status:\s*done/i.test(name)) return 't-done';
  if (/p0/i.test(name)) return 't-p0';
  if (/p1/i.test(name)) return 't-p1';
  if (/agent/i.test(name)) return 't-agent';
  return '';
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function shortSha(s){ return (s||'').slice(0,7); }
function fmtDate(s){ try{ return new Date(s).toLocaleDateString('zh-CN'); }catch(e){ return ''; } }

async function getJSON(path){
  const r = await fetch(API + path, { headers: H });
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + path);
  return r.json();
}

// build a group <li> with a twisty, title, count, and leaf <li> children
function group(icon, title, count, leavesHtml, collapsed){
  const cs = collapsed ? 'collapsed' : '';
  return `<li class="${cs}">
    <div class="node group">
      <span class="twist">▾</span>
      <span class="label">${icon} ${esc(title)}</span>
      <span class="count">${count}</span>
    </div>
    <ul class="children">${leavesHtml || '<li><div class="empty">无</div></li>'}</ul>
  </li>`;
}
function leaf(html){ return `<li><div class="node leaf">${html}</div></li>`; }

function render(branches, prs, issues){
  const issuesOnly = issues.filter(i => !i.pull_request);

  // branches: group by prefix
  const groups = {};
  branches.forEach(b => {
    const parts = b.name.split('/');
    const key = parts.length > 1 ? parts[0] + '/' : '(根)';
    (groups[key] = groups[key] || []).push(b);
  });
  const branchLeaves = Object.keys(groups).sort().map(k => {
    const items = groups[k].map(b => leaf(
      `<span class="label branch">🌿 ${esc(b.name)}</span>
       <span class="meta">${shortSha(b.commit && b.commit.sha)} ${b.protected?'· protected':''}</span>`
    )).join('');
    return group('📁', k, groups[k].length, items, false);
  }).join('');

  const prLeaves = prs.map(p => leaf(
    `<span class="label"><a href="${esc(p.html_url)}" target="_blank" rel="noopener">#${p.number} ${esc(p.title)}</a></span>
     <span class="meta"><span class="branch">${esc(p.head&&p.head.ref)} → ${esc(p.base&&p.base.ref)}</span>
       <span>by ${esc(p.user&&p.user.login)}</span>${p.draft?'<span class="tag">draft</span>':''}<span>${fmtDate(p.updated_at)}</span></span>`
  )).join('');

  const issueLeaves = issuesOnly.map(i => {
    const asg = i.assignee ? `<span class="assignee">👤 ${esc(i.assignee.login)}</span>`
                           : '<span style="color:var(--muted)">未认领</span>';
    const tags = (i.labels||[]).map(l => `<span class="tag ${tagClass(l.name)}">${esc(l.name)}</span>`).join(' ');
    return leaf(
      `<span class="label"><a href="${esc(i.html_url)}" target="_blank" rel="noopener">#${i.number} ${esc(i.title)}</a></span>
       <span class="meta">${asg} ${tags}</span>`
    );
  }).join('');

  const localLeaves =
    leaf(`<span class="label branch">D:\\AI工作区\\badian-game</span><span class="meta">→ feat/v6-hair-style · V6 发型层</span>`) +
    leaf(`<span class="label branch">…\\worktrees\\75a3</span><span class="meta">→ release/v6-map · V6 地图</span>`) +
    leaf(`<span class="label branch">…\\worktrees\\a926</span><span class="meta">→ detached @ 89360e2 · V3.0 基线</span>`) +
    leaf(`<span class="empty">以 git worktree list 实测为准；此处为 2026-11-22 快照</span>`);

  document.getElementById('root-children').innerHTML =
    group('🌿','远程分支', branches.length, branchLeaves, false) +
    group('🔀','开放 PR', prs.length, prLeaves, false) +
    group('📋','Issue 认领状态', issuesOnly.length, issueLeaves, false) +
    group('🖥️','本地 Worktree（静态）', 3, localLeaves, true);

  bindTwisties();
}

function bindTwisties(){
  document.querySelectorAll('.node.group').forEach(n => {
    n.onclick = (e) => {
      const li = n.parentElement;
      li.classList.toggle('collapsed');
      n.querySelector('.twist').textContent = li.classList.contains('collapsed') ? '▸' : '▾';
    };
  });
}

async function load(){
  const status = document.getElementById('status');
  status.innerHTML = '<span class="spin"></span> 正在拉取…';
  try {
    const [branches, prs, issues] = await Promise.all([
      getJSON('/branches?per_page=100'),
      getJSON('/pulls?state=open&per_page=100'),
      getJSON('/issues?state=open&per_page=100')
    ]);
    render(branches, prs, issues);
    status.textContent = '✅ 更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch (e) {
    status.innerHTML = '<span class="err">❌ 拉取失败：' + esc(e.message) + '</span>';
  }
}

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('expand').addEventListener('click', () => {
  document.querySelectorAll('li.collapsed').forEach(li => {
    li.classList.remove('collapsed');
    const t = li.querySelector(':scope > .node .twist'); if (t) t.textContent = '▾';
  });
});
document.getElementById('collapse').addEventListener('click', () => {
  document.querySelectorAll('#root-children > li').forEach(li => {
    li.classList.add('collapsed');
    const t = li.querySelector(':scope > .node .twist'); if (t) t.textContent = '▸';
  });
});
load();
</script>
</body>
</html>
