<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">全角色演出插件架构</title>
  <desc id="desc">服务端公开行动日志经解析和注册表分派到中央互动与三维演出；角色资产通过独立适配器接入，玩法结算不进入演出层。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101927"/><stop offset="1" stop-color="#1c1220"/></linearGradient>
    <linearGradient id="plugin" x2="1" y2="1"><stop stop-color="#372245"/><stop offset="1" stop-color="#51283a"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#e8c477"/></marker>
    <style>
      text{font-family:"Segoe UI","Microsoft YaHei",sans-serif;fill:#f5eddb}
      .title{font-size:34px;font-weight:800}.sub{font-size:16px;fill:#b9c5d6}.head{font-size:20px;font-weight:750}
      .body{font-size:15px;fill:#cbd5e4}.tiny{font-size:13px;fill:#9fb0c6}.label{font-size:13px;fill:#e8c477;font-weight:700}
      .box{fill:#19263a;stroke:#526a89;stroke-width:1.5;rx:16}.plugin{fill:url(#plugin);stroke:#c78f66;stroke-width:1.5;rx:16}
      .safe{fill:#142f2b;stroke:#4b9b82;stroke-width:1.5;rx:16}.line{fill:none;stroke:#e8c477;stroke-width:2.2;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="780" rx="24" fill="url(#bg)"/>
  <text x="60" y="65" class="title">全角色演出插件架构</text>
  <text x="60" y="96" class="sub">角色注册一次，实时与回放共用公开事件；演出不拥有规则、数值或随机结果。</text>

  <rect x="60" y="145" width="270" height="138" class="safe"/>
  <text x="84" y="183" class="head">服务端权威玩法层</text>
  <text x="84" y="216" class="body">行动名 actionName</text>
  <text x="84" y="244" class="body">公开数据 presentation</text>
  <text x="84" y="270" class="tiny">伤害 / 抽数 / 奖励仍在这里结算</text>

  <rect x="395" y="145" width="310" height="138" class="box"/>
  <text x="419" y="183" class="head">公开事件解析层</text>
  <text x="419" y="216" class="body">SnapLog → BattleEvent</text>
  <text x="419" y="244" class="body">仅转发显式公开字段</text>
  <text x="419" y="270" class="tiny">旧日志 / 未知行动安全降级</text>

  <rect x="770" y="145" width="370" height="138" class="plugin"/>
  <text x="794" y="183" class="head">角色演出插件</text>
  <text x="794" y="216" class="body">action → fx / 模式 / 时长</text>
  <text x="794" y="244" class="body">DOM overlay + 3D presenter</text>
  <text x="794" y="270" class="tiny">统一索引加载，不改主流程分支</text>

  <path d="M330 214H390" class="line"/><path d="M705 214H765" class="line"/>
  <text x="342" y="196" class="label">公开日志</text><text x="716" y="196" class="label">解析</text>

  <rect x="92" y="365" width="300" height="142" class="box"/>
  <text x="116" y="404" class="head">通用演出队列</text>
  <text x="116" y="437" class="body">去重 · 分簇 · 节奏 · 跳过</text>
  <text x="116" y="465" class="body">按注册时长与重大级别播放</text>
  <text x="116" y="491" class="tiny">实时与回放使用同一事件契约</text>

  <rect x="450" y="365" width="300" height="142" class="plugin"/>
  <text x="474" y="404" class="head">中央互动 overlay</text>
  <text x="474" y="437" class="body">鼠标 / 触摸 / 键盘</text>
  <text x="474" y="465" class="body">onSubmit / onCancel / onComplete</text>
  <text x="474" y="491" class="tiny">manual 仅门控本机行动确认</text>

  <rect x="808" y="365" width="300" height="142" class="plugin"/>
  <text x="832" y="404" class="head">3D action presenter</text>
  <text x="832" y="437" class="body">完整 event + durationMs</text>
  <text x="832" y="465" class="body">返回 handled 决定是否回退</text>
  <text x="832" y="491" class="tiny">warning → impact → dispose</text>

  <path d="M955 283V335H242V360" class="line"/>
  <path d="M242 507V545H600V560" class="line"/>
  <path d="M600 545H958V560" class="line"/>
  <text x="64" y="579" class="label">注册表分派</text>

  <rect x="92" y="585" width="1016" height="128" class="box"/>
  <text x="116" y="624" class="head">角色资产是另一条独立接入链</text>
  <text x="116" y="659" class="body">asset-spec + GLB → 异步加载 / 缓存 → CharacterRig 适配器 → 角色场景状态机</text>
  <text x="116" y="691" class="tiny">美术 agent 只交付资产；演出 agent 只消费公开事件；玩法集成 agent 负责权威事件与结算。</text>
</svg>
