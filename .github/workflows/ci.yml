name: CI

on:
  pull_request:
  push:
    branches: [main, 'fix/56-architecture-contracts']

permissions:
  contents: read

jobs:
  test-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -- --exclude tests/ui/e2e.test.ts --maxWorkers=2 --minWorkers=1
      - run: npx tsc -p tsconfig.json
      - run: npm run build

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- tests/ui/e2e.test.ts
