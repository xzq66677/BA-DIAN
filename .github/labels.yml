# 标签定义。由 .github/workflows/init-governance.yml 自动同步到 GitHub。
- name: "status: ready"
  color: "0e8a16"
  description: "可认领：任务已拆解，尚无人负责"
- name: "status: in-progress"
  color: "fbca04"
  description: "进行中：已认领，正在开发"
- name: "status: review"
  color: "1d76db"
  description: "待审核：PR 已提交，等待合并"
- name: "status: blocked"
  color: "d93f0b"
  description: "被阻塞：依赖未满足或需要决策"
- name: "status: done"
  color: "5319e7"
  description: "已完成：PR 合并后关闭"
- name: "type: bug"
  color: "d73a4a"
  description: "缺陷修复类任务"
- name: "type: feature"
  color: "a2eeef"
  description: "新功能类任务"
- name: "type: test"
  color: "bfd4f2"
  description: "测试与验证类任务"
- name: "priority: p0"
  color: "b60205"
  description: "最高优先级，阻塞发布"
- name: "priority: p1"
  color: "e99695"
  description: "高优先级，本迭代必须完成"
- name: "agent"
  color: "c5def5"
  description: "适合自动化 Agent 承接的任务"
