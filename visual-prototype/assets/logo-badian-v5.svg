<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 700" width="640" height="700" role="img" aria-label="拔典 BA DIAN V5.0 标志">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fbf1c4"/><stop offset="28%" stop-color="#e8c86a"/>
      <stop offset="62%" stop-color="#d8b04a"/><stop offset="100%" stop-color="#7d682f"/>
    </linearGradient>
    <linearGradient id="goldGradH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a7434"/><stop offset="22%" stop-color="#f7e6a8"/>
      <stop offset="50%" stop-color="#fff6d8"/><stop offset="78%" stop-color="#f7e6a8"/><stop offset="100%" stop-color="#8a7434"/>
    </linearGradient>
    <!-- 石台顶面 -->
    <linearGradient id="topFace" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#27384a"/><stop offset="50%" stop-color="#1a2530"/><stop offset="100%" stop-color="#121b26"/>
    </linearGradient>
    <!-- 石台侧面：左暗右亮 -->
    <linearGradient id="sideL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2632"/><stop offset="100%" stop-color="#090e14"/>
    </linearGradient>
    <linearGradient id="sideR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#263646"/><stop offset="100%" stop-color="#0c1219"/>
    </linearGradient>
    <radialGradient id="voidGrad" cx="50%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#1b2734"/><stop offset="58%" stop-color="#0d1420"/><stop offset="100%" stop-color="#070a0f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0d68a" stop-opacity="0.32"/><stop offset="100%" stop-color="#f0d68a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="13"/></filter>
    <filter id="innerShade" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/><feComposite in="b" in2="SourceGraphic" operator="out"/>
    </filter>
  </defs>

  <!-- 背板 + 光晕 -->
  <rect x="0" y="0" width="640" height="700" rx="24" fill="url(#voidGrad)"/>
  <circle cx="320" cy="238" r="212" fill="url(#halo)"/>

  <!-- ══ 核心徽记：立体六棱石台 + 三拳循环 ══ -->
  <g transform="translate(0,-12)">
    <!-- 底部光晕 -->
    <polygon points="320,80 462,159 462,301 320,380 178,301 178,159" fill="none" stroke="#f0d68a" stroke-opacity="0.22" stroke-width="16" filter="url(#softGlow)"/>

    <!-- 侧面（厚度）：先画底面六边形 -->
    <polygon points="320,98 462,177 462,319 320,398 178,319 178,177" fill="#080d13" stroke="#4a4027" stroke-width="2"/>
    <!-- 四个可见侧面 -->
    <polygon points="178,301 320,380 320,398 178,319" fill="url(#sideL)" stroke="#6a5a30" stroke-width="1.4"/>
    <polygon points="320,380 462,301 462,319 320,398" fill="url(#sideR)" stroke="#6a5a30" stroke-width="1.4"/>
    <polygon points="178,159 178,301 178,319 178,177" fill="url(#sideL)" stroke="#594c2b" stroke-width="1.2"/>
    <polygon points="462,301 462,159 462,177 462,319" fill="url(#sideR)" stroke="#594c2b" stroke-width="1.2"/>
    <!-- 侧面竖向刻线 -->
    <g stroke="#8a7434" stroke-width="0.9" stroke-opacity="0.5">
      <line x1="249" y1="341" x2="249" y2="359"/><line x1="391" y1="341" x2="391" y2="359"/>
      <line x1="178" y1="220" x2="178" y2="232"/><line x1="178" y1="262" x2="178" y2="274"/>
      <line x1="462" y1="220" x2="462" y2="232"/><line x1="462" y1="262" x2="462" y2="274"/>
    </g>

    <!-- 顶面六边形 -->
    <polygon points="320,80 462,159 462,301 320,380 178,301 178,159" fill="url(#topFace)" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round"/>
    <!-- 顶面内描金双线 -->
    <polygon points="320,97 447,168 447,292 320,363 193,292 193,168" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.85"/>
    <polygon points="320,105 436,173 436,287 320,355 204,287 204,173" fill="none" stroke="#8a7434" stroke-width="0.9" stroke-opacity="0.6"/>
    <!-- 顶面辐射刻线（六条） -->
    <g stroke="#8a7434" stroke-width="1" stroke-opacity="0.45">
      <line x1="320" y1="97" x2="320" y2="132"/><line x1="447" y1="168" x2="414" y2="187"/>
      <line x1="447" y1="292" x2="414" y2="273"/><line x1="320" y1="363" x2="320" y2="328"/>
      <line x1="193" y1="292" x2="226" y2="273"/><line x1="193" y1="168" x2="226" y2="187"/>
    </g>
    <!-- 六个铆钉 -->
    <g fill="url(#goldGrad)" stroke="#3a2f19" stroke-width="1">
      <circle cx="320" cy="88" r="4.2"/><circle cx="452" cy="163" r="4.2"/><circle cx="452" cy="297" r="4.2"/>
      <circle cx="320" cy="372" r="4.2"/><circle cx="188" cy="297" r="4.2"/><circle cx="188" cy="163" r="4.2"/>
    </g>

    <!-- 中央仪式台：多层环 + 刻度 -->
    <circle cx="320" cy="230" r="104" fill="#080d13" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="3"/>
    <circle cx="320" cy="230" r="96" fill="none" stroke="#8a7434" stroke-width="1.3" stroke-opacity="0.8"/>
    <circle cx="320" cy="230" r="88" fill="none" stroke="#8a7434" stroke-width="1" stroke-dasharray="2 7" stroke-opacity="0.85"/>

    <!-- 循环轨迹（三段弧 + 箭头） -->
    <g fill="none" stroke="#8a7434" stroke-width="1.6" stroke-opacity="0.75" stroke-linecap="round">
      <path d="M 322 176 A 84 84 0 0 1 384 268"/>
      <path d="M 366 288 A 84 84 0 0 1 274 288"/>
      <path d="M 256 268 A 84 84 0 0 1 318 176"/>
    </g>
    <g fill="#f0d68a">
      <path d="M 386 264 l -2 12 -11 -5 z"/>
      <path d="M 358 294 l -12 2 4 -12 z"/>
      <path d="M 254 264 l 2 12 11 -5 z"/>
    </g>

    <!-- ══ 三拳节点 ══ -->
    <!-- 石头 ✊ -->
    <g transform="translate(320,166)">
      <circle r="43" fill="#0d1420" stroke="url(#goldGrad)" stroke-width="2.6"/>
      <circle r="37" fill="none" stroke="#8a7434" stroke-width="1" stroke-opacity="0.7"/>
      <g transform="translate(0,1)">
        <path d="M -16 10 Q -19 -1 -12 -8 Q -6 -13 1 -11 Q 10 -9 14 -3 Q 17 2 16 10 Q 16 14 11 14 L -10 14 Q -16 14 -16 10 Z"
              fill="#e8c86a" fill-opacity="0.34" stroke="#f7e6a8" stroke-width="2.4" stroke-linejoin="round"/>
        <g fill="none" stroke="#f7e6a8" stroke-width="1.9" stroke-linecap="round" stroke-opacity="0.95">
          <path d="M -10 -4 Q -8 -9 -4 -8"/><path d="M -3 -9 Q -1 -12 3 -10"/><path d="M 5 -9 Q 8 -11 11 -6"/>
          <path d="M -16 4 Q -23 2 -19 -5 Q -17 -9 -13 -8"/>
        </g>
      </g>
      <text y="59" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" letter-spacing="2" fill="#e8c86a">石</text>
    </g>
    <!-- 剪刀 ✌ -->
    <g transform="translate(380,266)">
      <circle r="43" fill="#0d1420" stroke="#f3ead3" stroke-width="2.6" stroke-opacity="0.92"/>
      <circle r="37" fill="none" stroke="#8a7434" stroke-width="1" stroke-opacity="0.7"/>
      <g transform="translate(0,1)">
        <g fill="none" stroke="#f7e6a8" stroke-width="7" stroke-linecap="round">
          <path d="M -7 12 L -13 -12"/><path d="M 3 12 L 11 -14"/>
        </g>
        <path d="M -15 5 Q -16 14 -8 14 L 8 14 Q 16 14 15 5 Z" fill="#e8dcc0" fill-opacity="0.3" stroke="#f7e6a8" stroke-width="2.2" stroke-linejoin="round"/>
      </g>
      <text y="59" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" letter-spacing="2" fill="#e8c86a">剪</text>
    </g>
    <!-- 布 🖐 -->
    <g transform="translate(260,266)">
      <circle r="43" fill="#0d1420" stroke="url(#goldGrad)" stroke-width="2.6"/>
      <circle r="37" fill="none" stroke="#8a7434" stroke-width="1" stroke-opacity="0.7"/>
      <g transform="translate(0,2)">
        <g fill="none" stroke="#f7e6a8" stroke-width="6" stroke-linecap="round">
          <path d="M -9 2 L -11 -12"/><path d="M -3 2 L -4 -16"/><path d="M 3 2 L 4 -16"/><path d="M 9 2 L 11 -12"/>
          <path d="M -13 7 L -19 -2"/>
        </g>
        <path d="M -13 14 L -13 2 Q -13 -1 -10 -1 L 10 -1 Q 13 -1 13 2 L 13 14 Z" fill="#d8b04a" fill-opacity="0.22" stroke="#f7e6a8" stroke-width="2.2" stroke-linejoin="round"/>
      </g>
      <text y="59" text-anchor="middle" font-family="'PingFang SC',sans-serif" font-size="12" letter-spacing="2" fill="#e8c86a">布</text>
    </g>

    <!-- 中心朱红印 -->
    <circle cx="320" cy="230" r="14" fill="#a2231d" stroke="url(#goldGrad)" stroke-width="2.4"/>
    <circle cx="320" cy="230" r="5" fill="#f0d68a"/>
  </g>

  <!-- ══ 拔典 主字 ══ -->
  <text x="320" y="522" text-anchor="middle" font-family="STSong, SimSun, 'Songti SC', serif"
        font-size="106" font-weight="900" letter-spacing="18" fill="url(#goldGradH)" filter="url(#glow)">拔典</text>
  <text x="320" y="568" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif"
        font-size="24" font-weight="700" letter-spacing="14" fill="#cbb06a">BA DIAN</text>
  <line x1="196" y1="592" x2="444" y2="592" stroke="url(#goldGradH)" stroke-width="1.4"/>
  <circle cx="320" cy="592" r="3.2" fill="#a2231d"/>
  <text x="320" y="626" text-anchor="middle" font-family="'PingFang SC','Microsoft YaHei',sans-serif"
        font-size="17" letter-spacing="6" fill="#9aa0a8">石头剪刀布 · 深空生死局</text>

  <!-- 朱红印章 -->
  <g transform="translate(496,548)">
    <rect x="0" y="0" width="56" height="56" rx="6" fill="none" stroke="#c23a30" stroke-width="3"/>
    <rect x="5" y="5" width="46" height="46" rx="3" fill="#a2231d" fill-opacity="0.2" stroke="#c23a30" stroke-width="1"/>
    <text x="28" y="39" text-anchor="middle" font-family="STSong, SimSun, serif" font-size="30" font-weight="900" fill="#c23a30">典</text>
  </g>
  <text x="320" y="678" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" letter-spacing="5" fill="#5c6470">V5.0 · VISUAL CONCEPT</text>
</svg>
